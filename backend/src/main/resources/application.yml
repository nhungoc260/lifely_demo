spring:
  application:
    name: lifely-backend
  config:
    # Đọc .env nếu có: chạy từ backend/ thì .env nằm ở thư mục gốc (../.env).
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lifely}
    username: ${DB_USERNAME:lifely}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none            # schema do Flyway quản lý (đổi thành validate để Hibernate kiểm tra khớp schema)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    default-encoding: UTF-8       # email tiếng Việt có dấu
    password: ${MAIL_PASSWORD:}      # Gmail App Password, KHÔNG phải mật khẩu đăng nhập Gmail
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  autoconfigure:
    exclude:
      # Không dùng user mặc định do Spring tự sinh; xác thực JWT làm ở Phase 4.
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

lifely:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  demo-environment: ${DEMO_ENVIRONMENT:true}
  demo:
    refresh-deadlines-on-startup: ${DEMO_REFRESH_DEADLINES:true}
  mail:
    enabled: ${MAIL_ENABLED:false}
    # Cách 1 (Brevo API, HTTPS): điền BREVO_API_KEY + MAIL_FROM (email đã xác minh làm Sender trong Brevo).
    # Cách 2 (Gmail SMTP): để trống BREVO_API_KEY, điền MAIL_USERNAME + MAIL_PASSWORD (App Password). Không dùng được trên Render gói miễn phí.
    # Cách 0 (khuyên dùng khi deploy, không cần số điện thoại/tên miền): Gmail qua Google Apps Script, xem tools/apps-script-mail.gs
    apps-script-url: ${MAIL_APPS_SCRIPT_URL:}
    apps-script-secret: ${MAIL_APPS_SCRIPT_SECRET:}
    brevo-api-key: ${BREVO_API_KEY:}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    from-name: ${MAIL_FROM_NAME:LIFELY}
    admin-recipient: ${ADMIN_NOTIFY_EMAIL:}
    weekly-report-cron: "0 0 8 * * MON"
  auth:
    # Prototype chưa có email/SMS. true = in link đặt lại mật khẩu vào log máy chủ (CHỈ dev). Production: false.
    log-reset-link: ${LOG_RESET_LINK:true}
    # Refresh token nằm trong cookie httpOnly. HTTPS thật: COOKIE_SECURE=true. Frontend/backend khác site: COOKIE_SAME_SITE=None (kèm Secure).
    refresh-days: ${REFRESH_DAYS:14}
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
  google:
    # OAuth Client ID (loại Web application) từ Google Cloud Console. Client ID là thông tin công khai, không phải bí mật.
    # Đặt GOOGLE_CLIENT_ID= (để trống) để tắt đăng nhập bằng Google, hoặc điền Client ID khác để đổi project Google.
    client-id: ${GOOGLE_CLIENT_ID:1097555342952-i6h01m6bt4k5j06s4kts2t24tuavk9g0.apps.googleusercontent.com}
  rate-limit:
    per-minute: 30
  storage:
    dir: ${UPLOAD_DIR:./uploads}
  jobs:
    expiry-interval-ms: 60000
    escalation-interval-ms: 30000
    reminder-interval-ms: 300000
    rejoin-interval-ms: 3600000
    rejoin-initial-delay-ms: 90000
  push:
    # Sinh khóa: tools/push/generate-vapid-keys.sh. Khóa riêng là BÍ MẬT: chỉ đặt trong biến môi trường, không commit.
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:}
    ttl-seconds: 86400
  screening:
    # Ngưỡng sàng lọc sơ bộ: GIẢ ĐỊNH theo Thông tư 26/2013/TT-BYT, cần cơ sở y tế đối chiếu (docs/OPEN_QUESTIONS.md)
    heart-rate-min: 60
    heart-rate-max: 90
    systolic-min: 100
    systolic-max-exclusive: 160
    diastolic-min: 60
    diastolic-max-exclusive: 100
    weight-min-female: 42
    weight-min-other: 45
  notify:
    # SMS (mock). MẶC ĐỊNH TẮT. provider=mock chỉ ghi log, KHÔNG gửi thật. LIFELY KHÔNG có cuộc gọi tự động:
    # nhân viên tự bấm "Gọi người hiến" (liên kết tel:) để mở ứng dụng gọi điện của thiết bị.
    sms-enabled: ${NOTIFY_SMS_ENABLED:false}
    # Web Push (miễn phí, VAPID): cần thêm lifely.push.* bên dưới
    push-enabled: ${NOTIFY_PUSH_ENABLED:false}
    push-per-user-per-day: 20
    provider: ${NOTIFY_PROVIDER:mock}
    max-attempts: 3
    retry-base-seconds: 30
    batch-size: 20
    sms-per-user-per-day: 5
    appointment-reminder-hours: 24
    worker-interval-ms: 10000
    worker-initial-delay-ms: 20000
  matching:
    min-days-between-donations: 84
    # Giãn cách riêng cho nữ (mặc định bằng nam theo nguồn đã tra). GIẢ ĐỊNH, cơ sở y tế có thể chỉnh.
    min-days-between-donations-female: 84
    level-radius-km: [5, 10, 20, 50]
    # Cấp 5 = toàn quốc (không giới hạn km). Nhóm máu hiếm bắt đầu tìm toàn quốc ngay.
    nationwide-level-enabled: true
    rare-blood-types: [O-, A-, B-, AB-]
    rare-starts-nationwide: true
    max-contacts-per-round-rare: 30
    candidate-pool-size-nationwide: 1000
    # Ước lượng thời gian di chuyển (chỉ phục vụ điều phối): đường thực tế = đường chim bay x road-factor,
    # tốc độ theo giờ địa phương; giờ cao điểm chỉ áp dụng thứ Hai-thứ Sáu.
    road-factor: 1.35
    peak-speed-kmh: 15
    normal-speed-kmh: 25
    night-speed-kmh: 35
    timezone: Asia/Ho_Chi_Minh
    peak-morning-start: "06:30"
    peak-morning-end: "09:00"
    peak-evening-start: "16:30"
    peak-evening-end: "19:30"
    night-start: "22:00"
    night-end: "05:00"
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}   # access token ngắn hạn; phiên dài do refresh token đảm nhiệm
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
