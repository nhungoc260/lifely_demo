<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Đang ngoại tuyến · LIFELY</title>
<style>
  :root { --bg:#fbf9f8; --fg:#1c1917; --muted:#57534e; --card:#ffffff; --line:#e7e5e4; --accent:#be123c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14110f; --fg:#fafaf9; --muted:#d6d3d1; --card:#1f1b18; --line:#3b3632; --accent:#fb7185; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:28rem; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; }
  h1 { margin:0 0 8px; font-size:1.25rem; }
  p { margin:8px 0; line-height:1.55; color:var(--muted); }
  a.call { display:inline-block; margin-top:12px; padding:12px 18px; border-radius:12px; background:var(--accent); color:#fff; font-weight:600; text-decoration:none; }
  button { margin-top:12px; padding:10px 16px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--fg); font:inherit; }
</style>
</head>
<body>
<main>
  <h1>Bạn đang ngoại tuyến</h1>
  <p>LIFELY cần kết nối mạng để hiển thị yêu cầu máu và lịch hẹn mới nhất. Dữ liệu cá nhân không được lưu lại trên thiết bị khi ngoại tuyến.</p>
  <p><strong>Nếu bệnh nhân đang nguy kịch, đừng chờ ứng dụng.</strong> Hãy gọi cấp cứu 115 hoặc đến cơ sở y tế gần nhất.</p>
  <a class="call" href="tel:115">Gọi cấp cứu 115</a><br>
  <button type="button" onclick="location.reload()">Thử kết nối lại</button>
</main>
</body>
</html>
