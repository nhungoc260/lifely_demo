# Render Blueprint (tùy chọn). Có thể bỏ qua và tạo Web Service bằng tay theo DEPLOY.md.
services:
  - type: web
    name: lifely-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Bản demo: KHÔNG dùng profile prod để dữ liệu mẫu tự dời deadline mỗi lần khởi động.
      - key: DEMO_ENVIRONMENT
        value: "true"
      - key: DEMO_REFRESH_DEADLINES
        value: "true"
      - key: LOG_RESET_LINK
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: Lax
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: MAIL_ENABLED
        value: "true"
      - key: MAIL_APPS_SCRIPT_URL
        sync: false
      - key: MAIL_APPS_SCRIPT_SECRET
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
